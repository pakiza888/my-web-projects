
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Car Racing Game</title>
    <link rel="stylesheet" href="minicar.css">
</head>
<body>

    <div class="game-title">
        <h1>CAR RACING GAME</h1>
    </div>

    <div class="scoreboard">
        <div>Score: 0</div>
        <div>Speed: 120km/hr</div>
        <div>Level: 1</div>
    </div>

    <div class="game">

        <div class="road">

            <div class="lines1"></div>
            <div class="lines2"></div>

            <div class="car player">
                <div class="window"></div>
                <div class="wheel wheel1"></div>
                <div class="wheel wheel2"></div>
                <div class="wheel wheel3"></div>
                <div class="wheel wheel4"></div>
                <div class="light light1"></div>
                <div class="light light2"></div>
            </div>

            <div class="car enemy1">
                <div class="window"></div>
                <div class="wheel wheel1"></div>
                <div class="wheel wheel2"></div>
                <div class="wheel wheel3"></div>
                <div class="wheel wheel4"></div>
                <div class="light light1"></div>
                <div class="light light2"></div>
            </div>

            <div class="car enemy2">
                <div class="window"></div>
                <div class="wheel wheel1"></div>
                <div class="wheel wheel2"></div>
                <div class="wheel wheel3"></div>
                <div class="wheel wheel4"></div>
                <div class="light light1"></div>
                <div class="light light2"></div>
            </div>

            <div class="car enemy3">
                <div class="window"></div>
                <div class="wheel wheel1"></div>
                <div class="wheel wheel2"></div>
                <div class="wheel wheel3"></div>
                <div class="wheel wheel4"></div>
                <div class="light light1"></div>
                <div class="light light2"></div>
            </div>

        </div>

        <div class="instructions">
            <h2>How to Play</h2>
            <p>
                Avoid other cars and stay on the road.
                Watch the traffic and enjoy the race!
            </p>
        </div>

        <div class="start-btn">Start Race</div>

    </div>

</body>
</html>
